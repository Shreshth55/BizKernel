[workspace]
resolver = "2"
members = ["crates/store", "crates/core", "crates/agent"]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "LicenseRef-Proprietary"
publish = false

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
thiserror = "1"
bizkernel-store = { path = "crates/store" }
bizkernel-core = { path = "crates/core" }
